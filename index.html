<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>მოსაწვევი · ქალაქში</title>
<meta name="description" content="პერსონალური მოსაწვევი ქალაქშის ახალი ტურისტული პროგრამის პრეზენტაციაზე.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0906">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Qalaqshi">
<meta property="og:title" content="მოსაწვევი · ქალაქში">
<meta property="og:description" content="პერსონალური მოსაწვევი — ქალაქშის ახალი ტურისტული პროგრამის პრეზენტაცია.">
<meta property="og:image" content="https://qalaqshi-invite.vercel.app/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Marcellus&family=Noto+Serif+Georgian:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-pattern" aria-hidden="true"></div>
<div class="bg-vignette" aria-hidden="true"></div>

<div class="lang-switch" role="group" aria-label="Language">
  <button type="button" class="lang-switch__btn" data-lang="ka">GE</button>
  <button type="button" class="lang-switch__btn" data-lang="en">EN</button>
</div>

<main class="page">
  <article class="card">
    <img class="card__logo" src="logo.png" alt="Qalaqshi">

    <p class="eyebrow" data-i18n="eyebrow">პერსონალური მოსაწვევი</p>
    <h1 class="greeting" id="greeting">გამარჯობა</h1>

    <div class="text">
      <p data-i18n="p1"></p>
      <p data-i18n="p2"></p>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <ul class="details">
      <li id="rowDate">
        <span class="details__label" data-i18n="dateLabel">თარიღი</span>
        <span class="details__value" id="dateValue"></span>
      </li>
      <li id="rowTime">
        <span class="details__label" data-i18n="timeLabel">დრო</span>
        <span class="details__value" id="timeValue"></span>
      </li>
      <li>
        <span class="details__label" data-i18n="placeLabel">მისამართი</span>
        <span class="details__value" data-i18n="place">რესტორანი „ქალაქში“, გაგარინის 22</span>
      </li>
    </ul>

    <div class="text" style="margin-top:30px">
      <p data-i18n="p3"></p>
    </div>

    <div class="actions">
      <a class="btn btn--primary" href="https://maps.app.goo.gl/WaWc8voqUiJobctx8" target="_blank" rel="noopener" data-i18n="mapBtn">რუკაზე ნახვა</a>
      <button class="btn" type="button" id="calendarBtn" data-i18n="calendarBtn">კალენდარში დამატება</button>
    </div>

    <p class="signoff" data-i18n="signoff">გელოდებით</p>
  </article>

  <p class="footer">Qalaqshi · Tbilisi</p>
</main>

<script src="i18n.js"></script>
<script src="main.js"></script>
</body>
</html>
